<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Motion Lab</title><style>body{margin:0;background:#0b1020;color:#e7edf8;font:15px/1.5 system-ui;padding:24px}main{max-width:1000px;margin:auto}h1{font-size:38px;margin:0}.muted{color:#91a0b9}.panel{background:#121a2d;border:1px solid #26334d;border-radius:14px;padding:16px;margin:14px 0}label{display:block;color:#91a0b9;margin:10px 0 4px}input,textarea,select{width:100%;box-sizing:border-box;background:#080e1a;color:#e7edf8;border:1px solid #33415d;border-radius:8px;padding:10px}button{background:linear-gradient(110deg,#7c3aed,#0891b2);border:0;border-radius:8px;padding:10px 14px;color:white;cursor:pointer;margin:6px 4px 6px 0}pre{white-space:pre-wrap;background:#080e1a;padding:12px;border-radius:8px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.status{color:#67e8a5}</style><main><h1>CSS Motion Lab</h1><p class="muted">Tune a CSS animation, preview it and copy reusable keyframes.</p><div class="grid"><section class="panel"><label>Animation name</label><input id="name" value="floaty"><label>Duration</label><input id="duration" type="range" min=".2" max="5" step=".1" value="1.5"><label>Timing function</label><select id="ease"><option>ease</option><option>linear</option><option>ease-in</option><option>ease-out</option><option>ease-in-out</option></select><label>Translate Y</label><input id="y" type="range" min="-150" max="150" value="-35"><label>Rotate</label><input id="rot" type="range" min="-180" max="180" value="8"><label>Scale</label><input id="scale" type="range" min=".3" max="2" step=".05" value="1.1"><button id="copy">Copy CSS</button><button id="replay">Replay</button></section><section class="panel"><h2>Preview</h2><div style="height:240px;display:grid;place-items:center;background:#080e1a;border-radius:12px"><div id="demo" style="width:90px;height:90px;border-radius:22px;background:linear-gradient(135deg,#8b5cf6,#22d3ee)"></div></div><pre id="out"></pre></section></div></main><script>const $=id=>document.getElementById(id);let st;function render(){const n=$('name').value.replace(/[^a-z0-9_-]/gi,'')||'motion',d=$('duration').value,e=$('ease').value,y=$('y').value,r=$('rot').value,s=$('scale').value;const css=`@keyframes ${n} { from { transform: none; } to { transform: translateY(${y}px) rotate(${r}deg) scale(${s}); } }\\n.demo { animation: ${n} ${d}s ${e} infinite alternate; }`;$('out').textContent=css;if(st)st.remove();st=document.createElement('style');st.textContent=`@keyframes ${n}{to{transform:translateY(${y}px) rotate(${r}deg) scale(${s})}}#demo{animation:${n} ${d}s ${e} infinite alternate}`;document.head.append(st)}['name','duration','ease','y','rot','scale'].forEach(id=>$(id).addEventListener('input',render));$('replay').onclick=()=>{const el=$('demo');el.style.animation='none';void el.offsetWidth;el.style.animation='';render()};$('copy').onclick=async()=>navigator.clipboard.writeText($('out').textContent);render();</script></html>
